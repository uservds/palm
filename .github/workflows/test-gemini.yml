name: Test Gemini API access (geo-check)

on:
  workflow_dispatch: {}

jobs:
  test-gemini:
    runs-on: ubuntu-latest
    steps:
      - name: Call Gemini generateContent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node -e '
          const apiKey = process.env.GEMINI_API_KEY;
          if (!apiKey) { console.error("GEMINI_API_KEY secret не задан в репозитории"); process.exit(1); }
          fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent", {
            method: "POST",
            headers: { "Content-Type": "application/json", "x-goog-api-key": apiKey },
            body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: "Say OK" }] }] }),
          })
            .then(async (res) => {
              const text = await res.text();
              console.log("HTTP status:", res.status);
              console.log("Response:", text.slice(0, 500));
              process.exit(res.ok ? 0 : 1);
            })
            .catch((err) => { console.error("Request failed:", err.message); process.exit(1); });
          '
